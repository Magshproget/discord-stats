<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="auto" style="background: #1E1F22; border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <style>
    .card { fill: #2B2D31; stroke: rgba(255,255,255,0.08); stroke-width: 1; rx: 10px; }
    .label { fill: #949BA4; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .val { fill: #F2F3F5; font-size: 26px; font-weight: 800; }
    .unit { fill: #949BA4; font-size: 14px; font-weight: 500; }
    .sub { fill: #949BA4; font-size: 11px; }
    .sec-title { fill: #F2F3F5; font-size: 14px; font-weight: 700; }
  </style>

  <!-- Window Header / Top Bar -->
  <rect width="1000" height="640" fill="#1E1F22"/>
  <rect x="0" y="0" width="1000" height="40" fill="#111214"/>
  <circle cx="25" cy="20" r="6" fill="#ED4245"/>
  <circle cx="45" cy="20" r="6" fill="#FEE75C"/>
  <circle cx="65" cy="20" r="6" fill="#57F287"/>
  <text x="500" y="25" fill="#949BA4" font-size="12" font-weight="600" text-anchor="middle">Discord Lifetime Statistics — Demo Preview</text>

  <!-- User Banner -->
  <g transform="translate(30, 60)">
    <!-- Avatar -->
    <circle cx="28" cy="28" r="28" fill="url(#grad-avatar)"/>
    <text x="28" y="36" fill="white" font-size="22" font-weight="bold" text-anchor="middle">A</text>
    <circle cx="48" cy="46" r="7" fill="#23A55A" stroke="#1E1F22" stroke-width="2.5"/>
    
    <text x="70" y="24" fill="#F2F3F5" font-size="22" font-weight="bold">AlexGamer</text>
    <text x="70" y="44" fill="#949BA4" font-size="12">Discord Lifetime Statistics &amp; GDPR Analytics</text>

    <!-- Meta Tags -->
    <rect x="70" y="52" width="150" height="22" rx="11" fill="#2B2D31" stroke="rgba(255,255,255,0.08)"/>
    <text x="145" y="67" fill="#949BA4" font-size="11" text-anchor="middle">ID: 382910481948102948</text>

    <rect x="230" y="52" width="160" height="22" rx="11" fill="#2B2D31" stroke="rgba(255,255,255,0.08)"/>
    <text x="310" y="67" fill="#949BA4" font-size="11" text-anchor="middle">Створено: 15 березня 2019</text>

    <rect x="400" y="52" width="150" height="22" rx="11" fill="#2B2D31" stroke="rgba(255,255,255,0.08)"/>
    <text x="475" y="67" fill="#949BA4" font-size="11" text-anchor="middle">Вік акаунту: ~7 років</text>
  </g>

  <!-- 4 Key Stat Cards -->
  <g transform="translate(30, 155)">
    <!-- Card 1: Voice -->
    <rect x="0" y="0" width="220" height="95" class="card"/>
    <rect x="0" y="0" width="4" height="95" fill="#5865F2" rx="2"/>
    <text x="16" y="24" class="label">Голосові канали</text>
    <text x="16" y="56" class="val">4,820.5 <tspan class="unit">год</tspan></text>
    <text x="16" y="78" class="sub">⚡ 200.8 днів 24/7 спілкування</text>

    <!-- Card 2: App Sessions -->
    <rect x="240" y="0" width="220" height="95" class="card"/>
    <rect x="240" y="0" width="4" height="95" fill="#23A55A" rx="2"/>
    <text x="256" y="24" class="label">Сесії клієнта</text>
    <text x="256" y="56" class="val">6,140.2 <tspan class="unit">год</tspan></text>
    <text x="256" y="78" class="sub">🖥️ 255.8 днів у додатку</text>

    <!-- Card 3: Calls -->
    <rect x="480" y="0" width="220" height="95" class="card"/>
    <rect x="480" y="0" width="4" height="95" fill="#F0B232" rx="2"/>
    <text x="496" y="24" class="label">Підключень</text>
    <text x="496" y="56" class="val">3,150 <tspan class="unit">сесій</tspan></text>
    <text x="496" y="78" class="sub">⏱️ Сер.: 92 хв | Рекорд: 14.2 год</text>

    <!-- Card 4: Messages -->
    <rect x="720" y="0" width="220" height="95" class="card"/>
    <rect x="720" y="0" width="4" height="95" fill="#EB459E" rx="2"/>
    <text x="736" y="24" class="label">Повідомлень</text>
    <text x="736" y="56" class="val">18,420</text>
    <text x="736" y="78" class="sub">💬 42,100 слів у чатах</text>
  </g>

  <!-- Left: Annual Voice Chart -->
  <g transform="translate(30, 270)">
    <rect x="0" y="0" width="460" height="210" class="card"/>
    <text x="20" y="28" class="sec-title">📊 Розподіл голосового часу за роками</text>

    <!-- Bars -->
    <g transform="translate(20, 48)">
      <!-- 2020 -->
      <text x="0" y="16" fill="#949BA4" font-size="12" font-weight="600">2020</text>
      <rect x="45" y="4" width="310" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
      <rect x="45" y="4" width="160" height="18" rx="4" fill="url(#grad-voice)"/>
      <text x="365" y="17" fill="#F2F3F5" font-size="11" font-weight="bold">580 год</text>

      <!-- 2021 -->
      <text x="0" y="42" fill="#949BA4" font-size="12" font-weight="600">2021</text>
      <rect x="45" y="30" width="310" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
      <rect x="45" y="30" width="230" height="18" rx="4" fill="url(#grad-voice)"/>
      <text x="365" y="43" fill="#F2F3F5" font-size="11" font-weight="bold">820 год</text>

      <!-- 2022 -->
      <text x="0" y="68" fill="#949BA4" font-size="12" font-weight="600">2022</text>
      <rect x="45" y="56" width="310" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
      <rect x="45" y="56" width="270" height="18" rx="4" fill="url(#grad-voice)"/>
      <text x="365" y="69" fill="#F2F3F5" font-size="11" font-weight="bold">950 год</text>

      <!-- 2023 -->
      <text x="0" y="94" fill="#949BA4" font-size="12" font-weight="600">2023</text>
      <rect x="45" y="82" width="310" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
      <rect x="45" y="82" width="250" height="18" rx="4" fill="url(#grad-voice)"/>
      <text x="365" y="95" fill="#F2F3F5" font-size="11" font-weight="bold">890 год</text>

      <!-- 2024 -->
      <text x="0" y="120" fill="#949BA4" font-size="12" font-weight="600">2024</text>
      <rect x="45" y="108" width="310" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
      <rect x="45" y="108" width="215" height="18" rx="4" fill="url(#grad-voice)"/>
      <text x="365" y="121" fill="#F2F3F5" font-size="11" font-weight="bold">760 год</text>

      <!-- 2025 -->
      <text x="0" y="146" fill="#949BA4" font-size="12" font-weight="600">2025</text>
      <rect x="45" y="134" width="310" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
      <rect x="45" y="134" width="190" height="18" rx="4" fill="url(#grad-voice)"/>
      <text x="365" y="147" fill="#F2F3F5" font-size="11" font-weight="bold">680 год</text>
    </g>
  </g>

  <!-- Right: Top Games Section -->
  <g transform="translate(510, 270)">
    <rect x="0" y="0" width="460" height="210" class="card"/>
    <text x="20" y="28" class="sec-title">🎮 Топ ігор за часом у голосовому чаті</text>

    <g transform="translate(20, 48)">
      <!-- Game 1 -->
      <text x="0" y="16" fill="#949BA4" font-size="12" font-weight="600">Minecraft</text>
      <rect x="110" y="4" width="245" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
      <rect x="110" y="4" width="220" height="18" rx="4" fill="url(#grad-game)"/>
      <text x="365" y="17" fill="#F2F3F5" font-size="11" font-weight="bold">410 год</text>

      <!-- Game 2 -->
      <text x="0" y="42" fill="#949BA4" font-size="12" font-weight="600">Counter-Strike 2</text>
      <rect x="110" y="30" width="245" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
      <rect x="110" y="30" width="205" height="18" rx="4" fill="url(#grad-game)"/>
      <text x="365" y="43" fill="#F2F3F5" font-size="11" font-weight="bold">385 год</text>

      <!-- Game 3 -->
      <text x="0" y="68" fill="#949BA4" font-size="12" font-weight="600">Dota 2</text>
      <rect x="110" y="56" width="245" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
      <rect x="110" y="56" width="170" height="18" rx="4" fill="url(#grad-game)"/>
      <text x="365" y="69" fill="#F2F3F5" font-size="11" font-weight="bold">320 год</text>

      <!-- Game 4 -->
      <text x="0" y="94" fill="#949BA4" font-size="12" font-weight="600">Cyberpunk 2077</text>
      <rect x="110" y="82" width="245" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
      <rect x="110" y="82" width="105" height="18" rx="4" fill="url(#grad-game)"/>
      <text x="365" y="95" fill="#F2F3F5" font-size="11" font-weight="bold">195 год</text>

      <!-- Game 5 -->
      <text x="0" y="120" fill="#949BA4" font-size="12" font-weight="600">GTA V</text>
      <rect x="110" y="108" width="245" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
      <rect x="110" y="108" width="95" height="18" rx="4" fill="url(#grad-game)"/>
      <text x="365" y="121" fill="#F2F3F5" font-size="11" font-weight="bold">180 год</text>

      <!-- Game 6 -->
      <text x="0" y="146" fill="#949BA4" font-size="12" font-weight="600">Apex Legends</text>
      <rect x="110" y="134" width="245" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
      <rect x="110" y="134" width="75" height="18" rx="4" fill="url(#grad-game)"/>
      <text x="365" y="147" fill="#F2F3F5" font-size="11" font-weight="bold">140 год</text>
    </g>
  </g>

  <!-- Bottom: 24h Activity Timeline -->
  <g transform="translate(30, 495)">
    <rect x="0" y="0" width="940" height="120" class="card"/>
    <text x="20" y="26" class="sec-title">⏰ Розподіл активності за часом доби (00:00 — 23:00)</text>

    <!-- Hour Histogram Mini Bars (24 bars) -->
    <g transform="translate(20, 40)">
      <!-- 00 to 05 (Night) -->
      <rect x="0" y="32" width="30" height="18" rx="3" fill="#5865F2" opacity="0.3"/>
      <rect x="38" y="38" width="30" height="12" rx="3" fill="#5865F2" opacity="0.3"/>
      <rect x="76" y="44" width="30" height="6" rx="3" fill="#5865F2" opacity="0.2"/>
      <rect x="114" y="46" width="30" height="4" rx="3" fill="#5865F2" opacity="0.2"/>
      <rect x="152" y="44" width="30" height="6" rx="3" fill="#5865F2" opacity="0.2"/>
      <rect x="190" y="40" width="30" height="10" rx="3" fill="#5865F2" opacity="0.3"/>
      <!-- Morning -->
      <rect x="228" y="30" width="30" height="20" rx="3" fill="#5865F2" opacity="0.5"/>
      <rect x="266" y="24" width="30" height="26" rx="3" fill="#5865F2" opacity="0.6"/>
      <rect x="304" y="20" width="30" height="30" rx="3" fill="#5865F2" opacity="0.7"/>
      <rect x="342" y="18" width="30" height="32" rx="3" fill="#5865F2" opacity="0.7"/>
      <!-- Afternoon -->
      <rect x="380" y="14" width="30" height="36" rx="3" fill="#5865F2" opacity="0.8"/>
      <rect x="418" y="12" width="30" height="38" rx="3" fill="#5865F2" opacity="0.8"/>
      <rect x="456" y="10" width="30" height="40" rx="3" fill="#5865F2" opacity="0.8"/>
      <rect x="494" y="8" width="30" height="42" rx="3" fill="#5865F2" opacity="0.9"/>
      <rect x="532" y="6" width="30" height="44" rx="3" fill="#5865F2" opacity="0.9"/>
      <!-- Evening (Peak) -->
      <rect x="570" y="2" width="30" height="48" rx="3" fill="#7983F5"/>
      <rect x="608" y="0" width="30" height="50" rx="3" fill="#7983F5"/>
      <rect x="646" y="0" width="30" height="50" rx="3" fill="#7983F5"/>
      <rect x="684" y="2" width="30" height="48" rx="3" fill="#7983F5"/>
      <rect x="722" y="6" width="30" height="44" rx="3" fill="#7983F5"/>
      <!-- Late Evening -->
      <rect x="760" y="12" width="30" height="38" rx="3" fill="#5865F2" opacity="0.8"/>
      <rect x="798" y="18" width="30" height="32" rx="3" fill="#5865F2" opacity="0.7"/>
      <rect x="836" y="24" width="30" height="26" rx="3" fill="#5865F2" opacity="0.5"/>
      <rect x="874" y="28" width="30" height="22" rx="3" fill="#5865F2" opacity="0.4"/>

      <!-- Ticks -->
      <text x="15" y="66" fill="#949BA4" font-size="10" text-anchor="middle">00</text>
      <text x="243" y="66" fill="#949BA4" font-size="10" text-anchor="middle">06</text>
      <text x="471" y="66" fill="#949BA4" font-size="10" text-anchor="middle">12</text>
      <text x="699" y="66" fill="#949BA4" font-size="10" text-anchor="middle">18</text>
      <text x="889" y="66" fill="#949BA4" font-size="10" text-anchor="middle">23</text>
    </g>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="grad-avatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#EB459E"/>
    </linearGradient>
    <linearGradient id="grad-voice" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#7983F5"/>
    </linearGradient>
    <linearGradient id="grad-game" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0B232"/>
      <stop offset="100%" stop-color="#FF73FA"/>
    </linearGradient>
  </defs>
</svg>
